<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAATH - Feedback</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;background:#eaf4ff;display:flex;justify-content:center;align-items:center;padding:20px}.container{width:100%;max-width:500px;background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0002}.logo{text-align:center;color:#2563eb;font-size:32px;font-weight:bold}h2,p{text-align:center}h2{color:#222}p{color:#666}label{display:block;margin:18px 0 7px;font-weight:bold}.stars{text-align:center;margin:10px 0 20px}.stars span{font-size:35px;color:#2563eb;cursor:pointer;margin:3px}textarea,button{width:100%;padding:12px;border-radius:8px;font-size:15px}textarea{border:1px solid #ccc;height:110px;resize:none}button{margin-top:18px;border:0;background:#2563eb;color:white;cursor:pointer}#message{margin-top:15px;font-weight:bold}.success{color:green}.error{color:red}.links{text-align:center;margin-top:14px}.links a{color:#2563eb;text-decoration:none;font-weight:bold}</style></head><body><div class="container"><div class="logo">SAATH</div><h2>Share Your Feedback</h2><p>Tell us about your experience.</p><form id="feedbackForm"><label>Rating</label><div class="stars" id="stars"><span data-rating="1">☆</span><span data-rating="2">☆</span><span data-rating="3">☆</span><span data-rating="4">☆</span><span data-rating="5">☆</span></div><input type="hidden" id="rating"><label>Feedback</label><textarea id="comment" placeholder="Write your feedback..." required></textarea><button type="submit">Submit Feedback</button></form><p id="message"></p><div class="links"><a href="/">Home</a> · <a href="/resources/">Resources</a> · <a href="/request/">Request</a></div></div><script>document.querySelectorAll("#stars span").forEach(star=>star.addEventListener("click",()=>{const rating=star.dataset.rating;document.getElementById("rating").value=rating;document.querySelectorAll("#stars span").forEach(s=>s.textContent=s.dataset.rating<=rating?"★":"☆")}));document.getElementById("feedbackForm").addEventListener("submit",async e=>{e.preventDefault();const rating=document.getElementById("rating").value,comment=document.getElementById("comment").value.trim(),message=document.getElementById("message");if(!rating||!comment){message.textContent="Please fill all fields.";message.className="error";return}try{const r=await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating,comment})}),d=await r.json();if(!r.ok)throw Error(d.message);message.textContent="Feedback submitted successfully.";message.className="success";e.target.reset();document.querySelectorAll("#stars span").forEach(s=>s.textContent="☆")}catch(e){message.textContent="Failed to submit feedback.";message.className="error"}});</script></body></html>
