<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAATH - Request</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 32px;
            font-weight: bold;
        }

        h2,
        p {
            text-align: center;
        }

        h2 {
            color: #222;
        }

        p {
            color: #666;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
        }

        input,
        select,
        textarea {
            border: 1px solid #ccc;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            margin-top: 18px;
            border: 0;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">SAATH</div>

        <h2>Request an Item</h2>

        <p>Tell us what you need and why.</p>

        <form id="requestForm">

            <label for="item">Item Name</label>
            <input id="item" placeholder="Enter item name" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select category</option>
                <option>Books</option>
                <option>Electronics</option>
                <option>Clothing</option>
                <option>Furniture</option>
                <option>Other</option>
            </select>

            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" min="1"
                placeholder="Enter quantity" required>

            <label for="reason">Reason</label>
            <textarea id="reason"
                placeholder="Why do you need this item?"
                required></textarea>

            <button type="submit">Submit Request</button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        const form = document.getElementById("requestForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const item = document.getElementById("item").value.trim();
            const category = document.getElementById("category").value;
            const quantity = document.getElementById("quantity").value;
            const reason = document.getElementById("reason").value.trim();
            const message = document.getElementById("message");

            if (!item || !category || !quantity || !reason) {
                message.textContent = "Please fill all fields.";
                message.className = "error";
                return;
            }

            try {
                const response = await fetch("/api/requests", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        item,
                        category,
                        quantity,
                        reason
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message);
                }

                message.textContent = "Request submitted successfully.";
                message.className = "success";
                form.reset();

            } catch (error) {
                message.textContent = "Failed to submit request.";
                message.className = "error";
            }
        });
    </script>

</body>

</html>
